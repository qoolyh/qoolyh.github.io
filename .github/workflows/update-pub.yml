name: Update Pubs
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # 明确指定一个版本，比 '3.x' 更稳定

      - name: Install dependencies
        run: pip install scholarly requests lxml

      - name: Debug - List files
        run: ls -R scripts/ # 这行用来检查 scripts 文件夹里到底有没有文件

      - name: Run fetch script
        run: python3 scripts/fetch_scholar.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Auto-update publications from Scholar
          branch: main
